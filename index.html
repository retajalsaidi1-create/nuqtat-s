
<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta name="description" content="نقطة س - منصة تعليم الرياضيات">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول | نقطة س</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>

<header>

<h1>نقطة س</h1>

<p>منصتك لتعلّم الرياضيات</p>

<span class="teacher-name">
أ. رتاج السعيدية
</span>

</header>


<main class="login-container">

<div class="login-card">

<div class="login-icon">
✏️
</div>


<h2>مرحبًا بك في نقطة س 💗</h2>


<p class="welcome-text">
سجّل دخولك للوصول إلى دروسك وملخصاتك واختباراتك.
</p>


<form id="loginForm">

<label for="email">
البريد الإلكتروني
</label>

<input
type="email"
id="email"
placeholder="أدخل بريدك الإلكتروني"
required
>


<label for="password">
كلمة المرور
</label>

<input
type="password"
id="password"
placeholder="أدخل كلمة مرورك"
required
>


<button
type="submit"
class="login-button"
>
🔐 تسجيل الدخول
</button>

</form>


<div class="divider">

<span>أو</span>

</div>


<a
href="signup.html"
class="create-account"
style="display:block; text-decoration:none; box-sizing:border-box;"
>
📝 إنشاء حساب جديد
</a>


<p id="message" class="message"></p>

</div>


<div class="login-note">

<span>📚</span>

<p>

تعلّم الرياضيات بطريقة أبسط

<br>

مع أ. رتاج السعيدية ✨

</p>

</div>

</main>


<footer>

<p>
© نقطة س | أ. رتاج السعيدية ✨
</p>

</footer>


<script>

const SUPABASE_URL =
"https://nqtuiuglxabkyjlkmnhl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ZHAJVrsRkWrgtGdqr7vrzA_c1LnyEPV";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const loginForm =
document.getElementById("loginForm");


loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
    document.getElementById("email").value.trim();


    const password =
    document.getElementById("password").value;


    const message =
    document.getElementById("message");


    message.textContent =
    "جاري تسجيل الدخول...";


    const { data, error } =
    await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

    });


    if (error) {

        console.error(error);

        message.textContent =
        "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        return;

    }


    message.textContent =
    "تم تسجيل الدخول بنجاح 💗";


    if (data.user) {

        await supabaseClient
        .from("activity")
        .insert({

            user_id: data.user.id,

            page: "index",

            action: "login"

        });

    }


    setTimeout(function() {

        window.location.href =
        "grades.html";

    }, 500);

});

</script>


</body>

</html>
