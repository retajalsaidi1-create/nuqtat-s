<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | نقطة س</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header>

        <h1>نقطة س</h1>

        <p>منصتك لتعلّم الرياضيات</p>

        <span class="teacher-name">
            أ. رتاج السعيدية
        </span>

    </header>


    <main class="login-container">

        <div class="login-card">

            <div class="login-icon">
                ✏️
            </div>

            <h2>مرحبًا بك في نقطة س 💗</h2>

            <p class="welcome-text">
                سجّل دخولك للوصول إلى دروسك وملخصاتك واختباراتك.
            </p>


            <form onsubmit="enterSite(event)">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="أدخل بريدك الإلكتروني"
                    required
                >


                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="أدخل كلمة المرور"
                    required
                >


                <button type="submit" class="login-button">
                    🔐 تسجيل الدخول
                </button>

            </form>


            <div class="divider">
                <span>أو</span>
            </div>


            <button
                type="button"
                class="create-account"
                onclick="showMessage()"
            >
                📝 إنشاء حساب جديد
            </button>


            <p id="message" class="message"></p>

        </div>


        <div class="login-note">

            <span>📚</span>

            <p>
                تعلّم الرياضيات بطريقة أبسط
                <br>
                مع أ. رتاج السعيدية ✨
            </p>

        </div>

    </main>


    <footer>

        <p>
            <strong>نقطة س</strong>
            | مع أ. رتاج السعيدية ✨
        </p>

        <p>
            نتعلم الرياضيات بطريقة أبسط 💗
        </p>

    </footer>


    <script>

        const SUPABASE_URL =
            "https://nqtuiuglxabkyjlkmnhl.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_ZHAJVrsRkWrgtGdqr7vrzA_c1LnyEPV";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // تسجيل الدخول
        async function enterSite(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            message.textContent =
                "جاري تسجيل الدخول...";


            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                message.textContent =
                    "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

                console.error(error);

                return;
            }


            message.textContent =
                "تم تسجيل الدخول بنجاح 💗";


            if (data.user) {

                await supabaseClient
                    .from("activity")
                    .insert({
                        user_id: data.user.id,
                        page: "index.html",
                        action: "login"
                    });

            }


            setTimeout(() => {

                window.location.href =
                    "grade10.html";

            }, 500);

        }


        // إنشاء حساب
        async function showMessage() {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");


            if (!email || !password) {

                message.textContent =
                    "اكتبي البريد الإلكتروني وكلمة المرور أولًا 💗";

                return;
            }


            if (password.length < 6) {

                message.textContent =
                    "كلمة المرور يجب أن تكون 6 أحرف على الأقل.";

                return;
            }


            message.textContent =
                "جاري إنشاء الحساب...";


            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,
                    password: password

                });


            if (error) {

                message.textContent =
                    "❌ حدث خطأ: " + error.message;

                console.error(error);

                return;
            }


            if (data.user) {

                const { error: profileError } =
                    await supabaseClient
                        .from("profiles")
                        .insert({

                            id: data.user.id,
                            full_name: "",
                            grade: "10"

                        });


                if (profileError) {

                    console.error(profileError);

                }

            }


            message.textContent =
                "✅ تم إنشاء الحساب! تفقدي بريدك الإلكتروني لتأكيد الحساب.";

        }

    </script>

</body>

</html>
