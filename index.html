<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | نقطة س</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>نقطة س</h1>

        <p>منصتك لتعلّم الرياضيات</p>

        <span class="teacher-name">
            أ. رتاج السعيدية
        </span>

    </header>


    <main class="login-container">

        <div class="login-card">

            <div class="login-icon">
                ✏️
            </div>

            <h2>مرحبًا بك في نقطة س 💗</h2>

            <p class="welcome-text">
                سجّل دخولك للوصول إلى دروسك وملخصاتك واختباراتك.
            </p>


            <form onsubmit="enterSite(event)">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="أدخل بريدك الإلكتروني"
                    required
                >


                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="أدخل كلمة المرور"
                    required
                >


                <button type="submit" class="login-button">
                    🔐 تسجيل الدخول
                </button>

            </form>


            <div class="divider">
                <span>أو</span>
            </div>


            <button
                class="create-account"
                onclick="showMessage()"
            >
                📝 إنشاء حساب جديد
            </button>


            <p id="message" class="message"></p>

        </div>


        <div class="login-note">

            <span>📚</span>

            <p>
                تعلّم الرياضيات بطريقة أبسط
                <br>
                مع أ. رتاج السعيدية ✨
            </p>

        </div>

    </main>


    <footer>

        <p>
            <strong>نقطة س</strong>
            | مع أ. رتاج السعيدية ✨
        </p>

        <p>
            نتعلم الرياضيات بطريقة أبسط 💗
        </p>

    </footer>


    <script>

        function enterSite(event) {

            event.preventDefault();

            /*
             * حاليًا هذا مجرد نموذج تجريبي.
             * لاحقًا سيتم ربط تسجيل الدخول
             * بنظام الحسابات والاشتراكات.
             */

            window.location.href = "grade10.html";
        }


        function showMessage() {

            document.getElementById("message").textContent =
                "سيتم تفعيل إنشاء الحسابات قريبًا 💗";

        }

    </script>

</body>

</html>
