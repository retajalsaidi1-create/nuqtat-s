<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختبار الدرس ٢-١ | نقطة س</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff7fa;
            color: #3f3540;
        }

        .container {
            width: min(900px, 92%);
            margin: 40px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #9b657d;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
        }

        .quiz-card {
            background: white;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.07);
        }

        .progress {
            color: #9b657d;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .question {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.8;
            margin-bottom: 22px;
        }

        .instruction {
            background: #fff0f5;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: #765665;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            border: 2px solid #eadce3;
            border-radius: 14px;
            padding: 15px;
            cursor: pointer;
            transition: 0.2s;
            background: white;
        }

        .option:hover {
            border-color: #c88fa8;
            background: #fff8fb;
        }

        .option.selected {
            border-color: #9b657d;
            background: #fbeaf1;
        }

        .option input {
            margin-left: 8px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #e4d6dd;
            padding: 14px;
            text-align: center;
        }

        th {
            background: #f8e8ef;
            color: #765665;
        }

        td select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d9c5ce;
            border-radius: 10px;
            font-size: 15px;
            background: white;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 13px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .next-btn,
        .finish-btn {
            background: #9b657d;
            color: white;
        }

        .back-btn {
            background: #eee5e9;
            color: #5d4b55;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            text-align: center;
        }

        .score {
            font-size: 42px;
            font-weight: bold;
            color: #9b657d;
            margin: 20px 0;
        }

        .message {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .home-btn {
            background: #9b657d;
            color: white;
            text-decoration: none;
            display: inline-block;
            padding: 13px 25px;
            border-radius: 12px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .error-box {
            background: #fff0f0;
            border: 2px solid #e5a5a5;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: right;
            direction: ltr;
            overflow-wrap: anywhere;
        }

        .error-title {
            color: #b33a3a;
            font-weight: bold;
            margin-bottom: 10px;
            direction: rtl;
        }

        .error-text {
            color: #7a2222;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>اختبار الدرس ٢-١</h1>
        <p>جمع البيانات وتصنيفها</p>
    </div>

    <div id="quizArea" class="quiz-card">
        <div class="loading">جاري تحميل الاختبار...</div>
    </div>

</div>

<script>

    const SUPABASE_URL = "https://nqtuiuglxabkyjlkmnhl.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_ZHAJVrsRkWrgtGdqr7vrzA_c1LnyEPV";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    /* رقم الاختبار الموجود في جدول quizzes */
    const quizId = 1;

    const totalQuestions = 3;

    let currentQuestion = 0;

    let answers = {
        q1: [],
        q2: [],
        q3: {}
    };


    const questions = [

        {
            id: "q1",

            type: "multi",

            question:
                "حوّطي على جميع البيانات العددية المنفصلة من البيانات التالية:",

            options: [
                "عدد طلاب الصف",
                "الوزن",
                "الطول",
                "عدد السيارات",
                "لون الشعر",
                "لون العيون",
                "عدد الإخوة والأخوات",
                "عدد غرف المنزل"
            ],

            correct: [
                "عدد طلاب الصف",
                "عدد السيارات",
                "عدد الإخوة والأخوات",
                "عدد غرف المنزل"
            ]
        },


        {
            id: "q2",

            type: "multi",

            question:
                "حوّطي على جميع البيانات الإحصائية المتصلة مما يلي:",

            options: [
                "عدد السيارات الحمراء في مواقف المدرسة",
                "أطوال الطلاب",
                "متوسط الأعمار",
                "كتل مجموعة من الأطفال",
                "عدد الموظفين في مؤسسة حكومية",
                "عدد الإخوة والأخوات"
            ],

            correct: [
                "أطوال الطلاب",
                "متوسط الأعمار",
                "كتل مجموعة من الأطفال"
            ]
        },


        {
            id: "q3",

            type: "table",

            question:
                "صنّفي البيانات الآتية في الجدول المقابل:",

            options: [
                "عدد السيارات",
                "درجة الحرارة",
                "المسافة المقطوعة",
                "عدد الأهداف"
            ],

            correct: {
                "عدد السيارات": "منفصلة",
                "درجة الحرارة": "متصلة",
                "المسافة المقطوعة": "متصلة",
                "عدد الأهداف": "منفصلة"
            }
        }

    ];


    async function getCurrentUser() {

        const {
            data: { user },
            error
        } = await supabaseClient.auth.getUser();


        if (error) {

            console.error(
                "GET USER ERROR:",
                error
            );

            alert(
                "حدث خطأ في معرفة المستخدم: " +
                error.message
            );

            return null;
        }


        if (!user) {

            window.location.href = "index.html";

            return null;
        }


        return user;
    }



    function renderQuestion() {

        const area =
            document.getElementById("quizArea");

        const q =
            questions[currentQuestion];


        let html = `

            <div class="progress">
                السؤال ${currentQuestion + 1}
                من ${totalQuestions}
            </div>

            <div class="question">
                ${q.question}
            </div>

        `;


        if (q.id === "q1") {

            html += `

                <div class="instruction">
                    يمكنك اختيار أكثر من إجابة.
                </div>

                <div class="options">

            `;


            q.options.forEach(option => {

                const checked =
                    answers.q1.includes(option)
                        ? "checked"
                        : "";


                html += `

                    <label class="option">

                        <input
                            type="checkbox"
                            value="${option}"
                            ${checked}
                        >

                        ${option}

                    </label>

                `;
            });


            html += `</div>`;
        }



        if (q.id === "q2") {

            html += `

                <div class="instruction">
                    يمكنك اختيار أكثر من إجابة.
                </div>

                <div class="options">

            `;


            q.options.forEach(option => {

                const checked =
                    answers.q2.includes(option)
                        ? "checked"
                        : "";


                html += `

                    <label class="option">

                        <input
                            type="checkbox"
                            value="${option}"
                            ${checked}
                        >

                        ${option}

                    </label>

                `;
            });


            html += `</div>`;
        }



        if (q.id === "q3") {

            html += `

                <div class="instruction">
                    صنّفي كل بيان في العمود المناسب.
                </div>

                <div class="table-wrap">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    البيان
                                </th>

                                <th>
                                    نوع البيانات
                                </th>

                            </tr>

                        </thead>

                        <tbody>

            `;


            q.options.forEach(option => {

                const selected =
                    answers.q3[option] || "";


                html += `

                    <tr>

                        <td>
                            ${option}
                        </td>

                        <td>

                            <select
                                data-item="${option}"
                            >

                                <option value="">
                                    اختاري
                                </option>

                                <option
                                    value="منفصلة"
                                    ${selected === "منفصلة"
                                        ? "selected"
                                        : ""}
                                >
                                    بيانات منفصلة
                                </option>

                                <option
                                    value="متصلة"
                                    ${selected === "متصلة"
                                        ? "selected"
                                        : ""}
                                >
                                    بيانات متصلة
                                </option>

                            </select>

                        </td>

                    </tr>

                `;
            });


            html += `

                        </tbody>

                    </table>

                </div>

            `;
        }



        html += `

            <div class="buttons">

                <button
                    class="back-btn"
                    onclick="previousQuestion()"
                    ${currentQuestion === 0
                        ? "disabled"
                        : ""}
                >
                    السابق
                </button>

        `;



        if (
            currentQuestion <
            totalQuestions - 1
        ) {

            html += `

                <button
                    class="next-btn"
                    onclick="nextQuestion()"
                >
                    التالي
                </button>

            `;

        } else {

            html += `

                <button
                    class="finish-btn"
                    onclick="finishQuiz()"
                >
                    إنهاء الاختبار
                </button>

            `;
        }



        html += `</div>`;


        area.innerHTML = html;
    }



    function saveCurrentAnswer() {

        const q =
            questions[currentQuestion];


        if (q.id === "q1") {

            answers.q1 = Array.from(

                document.querySelectorAll(
                    '#quizArea input[type="checkbox"]:checked'
                )

            ).map(
                input => input.value
            );
        }



        if (q.id === "q2") {

            answers.q2 = Array.from(

                document.querySelectorAll(
                    '#quizArea input[type="checkbox"]:checked'
                )

            ).map(
                input => input.value
            );
        }



        if (q.id === "q3") {

            answers.q3 = {};


            document
                .querySelectorAll(
                    "select[data-item]"
                )
                .forEach(select => {

                    answers.q3[
                        select.dataset.item
                    ] = select.value;

                });
        }
    }



    function nextQuestion() {

        saveCurrentAnswer();


        if (
            currentQuestion <
            totalQuestions - 1
        ) {

            currentQuestion++;

            renderQuestion();
        }
    }



    function previousQuestion() {

        saveCurrentAnswer();


        if (currentQuestion > 0) {

            currentQuestion--;

            renderQuestion();
        }
    }



    function calculateScore() {

        let score = 0;


        const q1Correct =
            questions[0].correct;


        const q1Answer =
            [...answers.q1].sort();


        if (
            JSON.stringify(q1Answer) ===
            JSON.stringify(
                [...q1Correct].sort()
            )
        ) {

            score++;
        }



        const q2Correct =
            questions[1].correct;


        const q2Answer =
            [...answers.q2].sort();


        if (
            JSON.stringify(q2Answer) ===
            JSON.stringify(
                [...q2Correct].sort()
            )
        ) {

            score++;
        }



        const q3Correct =
            questions[2].correct;


        let q3CorrectCount = 0;


        Object.keys(q3Correct)
            .forEach(item => {

                if (
                    answers.q3[item] ===
                    q3Correct[item]
                ) {

                    q3CorrectCount++;
                }

            });



        if (
            q3CorrectCount ===
            Object.keys(q3Correct).length
        ) {

            score++;
        }


        return score;
    }



    async function finishQuiz() {

        saveCurrentAnswer();


        const score =
            calculateScore();


        const total =
            totalQuestions;


        const percentage =
            Math.round(
                (score / total) * 100
            );


        const user =
            await getCurrentUser();


        if (!user) return;



        /*
         * قراءة المحاولات السابقة
         */

        const {
            data: previousAttempts,
            error: previousError
        } = await supabaseClient

            .from("quiz_results")

            .select("id")

            .eq(
                "user_id",
                user.id
            )

            .eq(
                "quiz_id",
                quizId
            );



        if (previousError) {

            console.error(
                "SELECT ERROR:",
                previousError
            );


            document.getElementById(
                "quizArea"
            ).innerHTML = `

                <div class="error-box">

                    <div class="error-title">

                        ظهر خطأ أثناء قراءة نتائج الاختبار

                    </div>


                    <div class="error-text">

                        ${previousError.message}

                        <br><br>

                        Code:
                        ${previousError.code || "غير موجود"}

                        <br>

                        Details:
                        ${previousError.details || "غير موجود"}

                        <br>

                        Hint:
                        ${previousError.hint || "غير موجود"}

                    </div>

                </div>

            `;

            return;
        }



        const attemptNumber =
            (previousAttempts?.length || 0) + 1;



        /*
         * حفظ النتيجة
         */

        const {
            data: insertedData,
            error
        } = await supabaseClient

            .from("quiz_results")

            .insert({

                user_id: user.id,

                quiz_id: quizId,

                score: score,

                total: total,

                completed_at:
                    new Date().toISOString()

            })

            .select();



        if (error) {

            console.error(
                "INSERT ERROR:",
                error
            );


            document.getElementById(
                "quizArea"
            ).innerHTML = `

                <div class="error-box">

                    <div class="error-title">

                        ظهر خطأ أثناء حفظ نتيجة الاختبار

                    </div>


                    <div class="error-text">

                        ${error.message}

                        <br><br>

                        Code:
                        ${error.code || "غير موجود"}

                        <br>

                        Details:
                        ${error.details || "غير موجود"}

                        <br>

                        Hint:
                        ${error.hint || "غير موجود"}

                    </div>

                </div>

            `;

            return;
        }



        console.log(
            "RESULT SAVED:",
            insertedData
        );


        console.log(
            "ATTEMPT NUMBER:",
            attemptNumber
        );



        let message = "";



        if (percentage === 100) {

            message =
                "ممتاز جدًا! 🎉 أحسنتِ!";

        }

        else if (percentage >= 66) {

            message =
                "أحسنتِ! لديكِ فهم جيد للدرس 🌷";

        }

        else {

            message =
                "بداية جيدة! راجعي الدرس وحاولي مرة أخرى 💗";

        }



        document.getElementById(
            "quizArea"
        ).innerHTML = `

            <div class="result">

                <div class="question">
                    انتهى الاختبار 🎉
                </div>


                <div class="score">
                    ${score} / ${total}
                </div>


                <div class="message">
                    ${message}
                </div>


                <p>

                    النسبة:

                    <strong>
                        ${percentage}%
                    </strong>

                </p>


                <div
                    class="buttons"
                    style="justify-content:center;"
                >

                    <button
                        class="back-btn"
                        onclick="location.reload()"
                    >
                        إعادة الاختبار
                    </button>


                    <a
                        href="lesson.html?lesson=6"
                        class="home-btn"
                    >
                        العودة إلى الدرس
                    </a>

                </div>

            </div>

        `;
    }



    getCurrentUser().then(user => {

        if (user) {

            renderQuestion();

        }

    });

</script>

</body>
</html>
