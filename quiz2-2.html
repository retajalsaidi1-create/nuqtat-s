/* المستخدم */
async function getCurrentUser(){
  const {data:{user},error} = await supabaseClient.auth.getUser();

  if(error){
    showError("حدث خطأ في معرفة المستخدم",error);
    return null;
  }

  if(!user){
    window.location.href="index.html";
    return null;
  }

  return user;
}


/* توحيد الأرقام العربية والإنجليزية */
function normalizeAnswer(value){
  return String(value||"")
    .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/[،]/g,",")
    .replace(/\s+/g,"")
    .replace(/[٫]/g,".")
    .trim();
}


/* التحقق من الإجابة */
function isCorrectAnswer(question,index){
  const answer=selectedAnswers[index];

  if(question.type==="choice"){
    return Number(answer)===question.correct;
  }

  const normalized=normalizeAnswer(answer);

  return question.answers.some(
    item=>normalizeAnswer(item)===normalized
  );
}


/* عرض السؤال */
function renderQuestion(){
  const q=questions[currentQuestion];
  const area=document.getElementById("quizArea");
  const chosen=selectedAnswers[currentQuestion];
  const progress=((currentQuestion+1)/questions.length)*100;

  let html=`
    <div class="progress">
      السؤال ${currentQuestion+1} من ${questions.length}
    </div>

    <div class="progress-track">
      <div class="progress-fill" style="width:${progress}%"></div>
    </div>

    <div class="question">${q.question}</div>

    ${q.diagram||""}

    <div class="instruction">${q.instruction||""}</div>
  `;

  if(q.type==="choice"){
    html+=`<div class="options">`;

    q.options.forEach((option,index)=>{
      html+=`
        <label class="option ${chosen===index?'selected':''}">
          <input type="radio"
            name="answer"
            value="${index}"
            ${chosen===index?'checked':''}>
          ${option}
        </label>
      `;
    });

    html+=`</div>`;
  }else{
    html+=`
      <input
        class="answer-input"
        id="writtenAnswer"
        type="text"
        autocomplete="off"
        placeholder="${q.placeholder||'اكتبي إجابتك هنا'}"
        value="${chosen??''}"
      >
    `;
  }

  html+=`
    <div class="buttons">
      <button class="back-btn"
        onclick="previousQuestion()"
        ${currentQuestion===0?'disabled':''}>
        السابق
      </button>
  `;

  if(currentQuestion<questions.length-1){
    html+=`
      <button class="next-btn" onclick="nextQuestion()">
        التالي
      </button>
    `;
  }else{
    html+=`
      <button class="finish-btn" onclick="finishQuiz()">
        إنهاء الاختبار
      </button>
    `;
  }

  html+=`</div>`;
  area.innerHTML=html;

  if(q.type==="choice"){
    area.querySelectorAll('input[name="answer"]').forEach(input=>{
      input.addEventListener("change",()=>{
        selectedAnswers[currentQuestion]=Number(input.value);
        renderQuestion();
      });
    });
  }else{
    const input=document.getElementById("writtenAnswer");
    input.addEventListener("input",()=>{
      selectedAnswers[currentQuestion]=input.value;
    });
  }
}


/* حفظ الإجابة الحالية */
function saveCurrentAnswer(){
  const q=questions[currentQuestion];

  if(q.type==="text"){
    const input=document.getElementById("writtenAnswer");
    if(input){
      selectedAnswers[currentQuestion]=input.value.trim();
    }
  }
}


function nextQuestion(){
  saveCurrentAnswer();

  const answer=selectedAnswers[currentQuestion];

  if(answer===undefined || String(answer).trim()===""){
    alert("أجيبي عن السؤال قبل الانتقال للسؤال التالي.");
    return;
  }

  if(currentQuestion<questions.length-1){
    currentQuestion++;
    renderQuestion();
  }
}


function previousQuestion(){
  saveCurrentAnswer();

  if(currentQuestion>0){
    currentQuestion--;
    renderQuestion();
  }
}


function calculateScore(){
  return questions.reduce((sum,q,index)=>
    sum+(isCorrectAnswer(q,index)?1:0),0);
}


function showError(title,error){
  document.getElementById("quizArea").innerHTML=`
    <div class="error-box">
      <div class="error-title">${title}</div>
      <div class="error-text">
        ${error?.message||"خطأ غير معروف"}
        <br><br>
        Code: ${error?.code||"غير موجود"}
        <br>
        Details: ${error?.details||"غير موجود"}
        <br>
        Hint: ${error?.hint||"غير موجود"}
      </div>
    </div>
  `;
}


/* إنهاء الاختبار وحفظ النتيجة */
async function finishQuiz(){
  saveCurrentAnswer();

  const unanswered=questions.findIndex((q,index)=>
    selectedAnswers[index]===undefined ||
    String(selectedAnswers[index]).trim()===""
  );

  if(unanswered!==-1){
    currentQuestion=unanswered;
    renderQuestion();
    alert("أجيبي عن جميع الأسئلة قبل إرسال الاختبار.");
    return;
  }

  const area=document.getElementById("quizArea");
  area.innerHTML='<div class="loading">جارٍ حفظ نتيجتك...</div>';

  const user=await getCurrentUser();
  if(!user)return;

  const score=calculateScore();
  const total=questions.length;
  const percentage=Math.round(score/total*100);

  const {data:previousAttempts,error:previousError}=
    await supabaseClient
      .from("quiz_results")
      .select("id")
      .eq("user_id",user.id)
      .eq("quiz_id",quizId);

  if(previousError){
    showError("حدث خطأ أثناء قراءة محاولات الاختبار",previousError);
    return;
  }

  const attemptNumber=(previousAttempts?.length||0)+1;

  const {error}=await supabaseClient
    .from("quiz_results")
    .insert({
      user_id:user.id,
      quiz_id:quizId,
      score:score,
      total:total,
      completed_at:new Date().toISOString()
    });

  if(error){
    showError("حدث خطأ أثناء حفظ نتيجة الاختبار",error);
    return;
  }

  let message=percentage===100
    ?"ممتاز جدًا! جميع إجاباتك صحيحة 🎉"
    :percentage>=70
    ?"أحسنتِ! لديكِ فهم جيد للدرس 🌷"
    :"بداية جيدة! راجعي التصحيح وحاولي تحسين نتيجتك 💗";

  let review='<div class="review"><h3>تصحيح إجاباتك</h3>';

  questions.forEach((q,index)=>{
    const correct=isCorrectAnswer(q,index);

    let studentAnswer="";
    let correctAnswer="";

    if(q.type==="choice"){
      studentAnswer=q.options[Number(selectedAnswers[index])];
      correctAnswer=q.options[q.correct];
    }else{
      studentAnswer=selectedAnswers[index];
      correctAnswer=q.displayAnswer;
    }

    review+=`
      <div class="review-item ${correct?'good':'bad'}">
        <strong>
          السؤال ${index+1} — ${correct?'إجابة صحيحة ✓':'إجابة غير صحيحة ✗'}
        </strong>

        <div>${q.question}</div>

        <div class="${correct?'answer-correct':'answer-wrong'}">
          إجابتك: ${studentAnswer}
        </div>

        ${!correct?`
          <div class="answer-correct">
            الإجابة الصحيحة: ${correctAnswer}
          </div>
        `:''}

        <div class="explanation">${q.explanation}</div>
      </div>
    `;
  });

  review+='</div>';

  area.innerHTML=`
    <div class="result">
      <div class="question">انتهى الاختبار 🎉</div>
      <div class="score">${score} / ${total}</div>
      <div class="message">${message}</div>
      <p>النسبة: <strong>${percentage}%</strong></p>
      <p style="color:#777;font-size:14px">
        المحاولة رقم ${attemptNumber} — تم حفظ نتيجتك.
      </p>

      <div class="buttons" style="justify-content:center">
        <button class="back-btn" onclick="location.reload()">
          إعادة الاختبار
        </button>

        <a href="lesson.html?lesson=7" class="home-btn">
          العودة إلى الدرس
        </a>
      </div>
    </div>

    ${review}
  `;

  area.scrollIntoView({behavior:"smooth",block:"start"});
}


/* بدء الاختبار */
getCurrentUser().then(user=>{
  if(user){
    renderQuestion();
  }
});
