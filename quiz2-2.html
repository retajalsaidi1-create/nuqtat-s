<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الدرس ٢-٢ | نقطة س</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff7fa;color:#3f3540;line-height:1.8}
.container{width:min(900px,92%);margin:35px auto}
.header{text-align:center;margin-bottom:25px}
.header h1{color:#9b657d;margin-bottom:8px}
.header p{color:#777;margin:0}
.quiz-card{background:#fff;border-radius:20px;padding:26px;box-shadow:0 5px 25px #00000012}
.progress{color:#9b657d;font-weight:bold;margin-bottom:18px}
.progress-track{height:8px;background:#f2e5eb;border-radius:20px;margin:8px 0 22px;overflow:hidden}
.progress-fill{height:100%;background:#dba8bd;border-radius:20px;transition:width .2s}
.question{font-size:20px;font-weight:bold;line-height:1.9;margin-bottom:18px}
.instruction{background:#fff0f5;padding:12px 15px;border-radius:12px;margin-bottom:18px;color:#765665}
.options{display:grid;gap:11px}
.option{display:block;border:2px solid #eadce3;border-radius:14px;padding:13px 15px;cursor:pointer;transition:.2s;background:#fff}
.option:hover{border-color:#c88fa8;background:#fff8fb}
.option.selected{border-color:#9b657d;background:#fbeaf1}
.option input{margin-left:9px;accent-color:#9b657d}
.buttons{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
button{border:0;border-radius:12px;padding:13px 23px;font-size:16px;cursor:pointer;font-weight:bold}
.next-btn,.finish-btn,.home-btn{background:#9b657d;color:#fff}
.back-btn{background:#eee5e9;color:#5d4b55}
button:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}
.score{font-size:42px;font-weight:bold;color:#9b657d;margin:15px 0}
.message{font-size:19px;margin-bottom:20px}
.home-btn{display:inline-block;padding:12px 22px;border-radius:12px;text-decoration:none}
.review{text-align:right;margin-top:25px}
.review-item{border:1px solid #eadce3;border-radius:13px;padding:13px;margin:12px 0;background:#fff}
.review-item.good{border-right:5px solid #65a879}
.review-item.bad{border-right:5px solid #d87575}
.review-item strong{display:block;margin-bottom:5px}
.answer-correct{color:#287844;font-weight:bold}
.answer-wrong{color:#b33a3a}
.explanation{color:#665962;font-size:14px;margin-top:5px}
.error-box{background:#fff0f0;border:2px solid #e5a5a5;border-radius:15px;padding:20px;margin-top:20px;text-align:right;direction:ltr;overflow-wrap:anywhere}
.error-title{color:#b33a3a;font-weight:bold;margin-bottom:10px;direction:rtl}
.error-text{color:#7a2222;font-family:monospace;font-size:14px;line-height:1.7}
.loading{text-align:center;padding:40px}
@media(max-width:600px){.container{margin:22px auto}.quiz-card{padding:18px}.question{font-size:18px}.buttons button{padding:12px 15px}}
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <h1>اختبار الدرس ٢-٢</h1>
    <p>تنظيم البيانات</p>
  </div>
  <div id="quizArea" class="quiz-card">
    <div class="loading">جاري تحميل الاختبار...</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://nqtuiuglxabkyjlkmnhl.supabase.co";

const SUPABASE_KEY = "sb_publishable_ZHAJVrsRkWrgtGdqr7vrzA_c1LnyEPV";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* تأكدي من رقم الاختبار في جدول quizzes */
const quizId = 2;

let currentQuestion = 0;
let selectedAnswers = {};

const questions = [

{
question:"سُجّلت أعداد السيارات التي تجاوزت نقطة مرور خلال ساعة: ١٦، ٤٨، ١١، ٣١، ٥، ١، ٤٥، ٢٩، ٣١، ٧، ٢٠، ٢٢. عند تنظيم البيانات بطريقة الساق والورقة، ما الأوراق التي تقابل الساق ٣؟",

options:["١ ، ١","٠ ، ٢","٥ ، ٨","١ ، ٦"],
correct:0,

explanation:"القيم التي تقع في الثلاثينات هي ٣١ و٣١؛ لذلك الساق ٣ وأوراقها ١ ، ١."
},

{
question:"يوضح تمثيل الساق والورقة أطوال الطالبات. إذا كان أقصر طول ١٤٥ سم وأطول طول ١٨٠ سم، فما الفرق بينهما؟",

options:["٣٣ سم","٣٤ سم","٣٥ سم","٣٦ سم"],
correct:2,

explanation:"الفرق = أكبر قيمة − أصغر قيمة = ١٨٠ − ١٤٥ = ٣٥ سم."
},

{
question:"في مخطط بالصور لمعدل سقوط الأمطار، تمثل صورة السحابة الكاملة ٢ ملم. إذا كان تمثيل شهر أغسطس ٣ سحب ونصف، وتمثيل شهر أكتوبر سحابتين ونصف، فبكم يزيد معدل سقوط الأمطار في أغسطس عن أكتوبر؟",

options:["١ ملم","٢ ملم","٣ ملم","٤ ملم"],
correct:1,

explanation:"أغسطس = ٣٫٥ × ٢ = ٧ ملم، وأكتوبر = ٢٫٥ × ٢ = ٥ ملم؛ والفرق = ٢ ملم."
},

{
question:"في التمثيل بالصور لعدد زوار المتحف، تمثل الدائرة الكاملة ١٠٠ زائر. إذا كان عدد الزوار في شعبان ٣ دوائر ونصف، وفي شوال ٥ دوائر وثلاثة أرباع، فما إجمالي عدد الزوار في الشهرين؟",

options:["٨٢٥ زائرًا","٩٠٠ زائر","٩٢٥ زائرًا","١٠٠٠ زائر"],
correct:2,

explanation:"شعبان = ٣٥٠ زائرًا، وشوال = ٥٧٥ زائرًا؛ المجموع = ٩٢٥ زائرًا."
},

{
question:"يوضح مخطط بالأعمدة ماركات السيارات المفضلة لدى مجموعة من الأشخاص. إذا كانت تكرارات الماركات هي: نيسان ٤٠، سوبارو ٣٠، تويوتا ٨٠، ميتسوبيشي ٢٠، مازدا ٣٠؛ فما تكرار ماركة تويوتا؟",

options:["٢٠","٣٠","٤٠","٨٠"],
correct:3,

explanation:"نقرأ ارتفاع عمود تويوتا على محور التكرار، فنجد أن تكراره ٨٠ شخصًا."
},

{
question:"يبين جدول تكراري أطوال النباتات: الفئة ٤٠–٤٩ تكرارها ٥، والفئة ٥٠–٥٩ تكرارها ٧، والفئة ٦٠–٦٩ تكرارها ٨. كم عدد النباتات التي أطوالها ٤٠ سم على الأقل ولا تزيد عن ٦٩ سم؟",

options:["١٥ نباتًا","١٨ نباتًا","٢٠ نباتًا","٢٥ نباتًا"],
correct:2,

explanation:"نجمع تكرارات الفئات المطلوبة: ٥ + ٧ + ٨ = ٢٠ نباتًا."
},

{
question:"في مخطط بالأعمدة لعدد القصص التي قرأتها الطالبات، كان تكرار الفئة (٢٠–٢٤ قصة) يساوي ٦. ماذا يعني ذلك؟",

options:[
"٦ طالبات قرأن من ٢٠ إلى ٢٤ قصة",
"عدد القصص في الفئة هو ٦ فقط",
"٦ طالبات قرأن ٢٤ قصة بالضبط",
"عدد الطالبات كلهن ٦"
],
correct:0,

explanation:"التكرار يمثل عدد الطالبات في الفئة؛ أي إن ٦ طالبات قرأن عددًا من القصص يتراوح بين ٢٠ و٢٤."
},

{
question:"ما الميزة الأساسية لتمثيل البيانات بطريقة الساق والورقة؟",

options:[
"يعرض النسب المئوية فقط",
"ينظم البيانات ويحافظ على القيم الأصلية",
"يحوّل البيانات إلى صور",
"يستخدم للبيانات الوصفية فقط"
],
correct:1,

explanation:"يساعد تمثيل الساق والورقة على ترتيب البيانات العددية وعرض قيمها الأصلية في الوقت نفسه."
}

];


async function getCurrentUser(){

const {data:{user},error} =
await supabaseClient.auth.getUser();

if(error){
showError("حدث خطأ في معرفة المستخدم",error);
return null;
}

if(!user){
window.location.href="index.html";
return null;
}

return user;
}


function renderQuestion(){

const q=questions[currentQuestion];
const area=document.getElementById("quizArea");

const chosen=selectedAnswers[currentQuestion];

const progress=((currentQuestion+1)/questions.length)*100;

let html=`

<div class="progress">
السؤال ${currentQuestion+1} من ${questions.length}
</div>

<div class="progress-track">
<div class="progress-fill" style="width:${progress}%"></div>
</div>

<div class="question">${q.question}</div>

<div class="instruction">
اختاري إجابة واحدة صحيحة.
</div>

<div class="options">
`;

q.options.forEach((option,index)=>{

html+=`

<label class="option ${chosen===index?'selected':''}">

<input type="radio"
name="answer"
value="${index}"
${chosen===index?'checked':''}>

${option}

</label>
`;

});

html+=`</div><div class="buttons">

<button class="back-btn"
onclick="previousQuestion()"
${currentQuestion===0?'disabled':''}>
السابق
</button>`;

if(currentQuestion<questions.length-1){

html+=`<button class="next-btn"
onclick="nextQuestion()">التالي</button>`;

}else{

html+=`<button class="finish-btn"
onclick="finishQuiz()">إنهاء الاختبار</button>`;

}

html+=`</div>`;

area.innerHTML=html;

area.querySelectorAll('input[name="answer"]').forEach(input=>{

input.addEventListener("change",()=>{

selectedAnswers[currentQuestion]=Number(input.value);

renderQuestion();

});

});

}


function nextQuestion(){

if(selectedAnswers[currentQuestion]===undefined){

alert("اختاري إجابة قبل الانتقال للسؤال التالي.");

return;

}

if(currentQuestion<questions.length-1){

currentQuestion++;

renderQuestion();

}

}


function previousQuestion(){

if(currentQuestion>0){

currentQuestion--;

renderQuestion();

}

}


function calculateScore(){

return questions.reduce((sum,q,index)=>
sum+(selectedAnswers[index]===q.correct?1:0),0);

}


function showError(title,error){

document.getElementById("quizArea").innerHTML=`

<div class="error-box">

<div class="error-title">${title}</div>

<div class="error-text">

${error?.message||"خطأ غير معروف"}

<br><br>

Code: ${error?.code||"غير موجود"}

<br>

Details: ${error?.details||"غير موجود"}

<br>

Hint: ${error?.hint||"غير موجود"}

</div>

</div>`;

}


async function finishQuiz(){

if(selectedAnswers[currentQuestion]===undefined){

alert("اختاري إجابة السؤال الأخير قبل إنهاء الاختبار.");

return;

}

const unanswered=questions.findIndex((q,index)=>
selectedAnswers[index]===undefined);

if(unanswered!==-1){

currentQuestion=unanswered;

renderQuestion();

alert("أجيبي عن جميع الأسئلة قبل إرسال الاختبار.");

return;

}

const area=document.getElementById("quizArea");

area.innerHTML='<div class="loading">جارٍ حفظ نتيجتك...</div>';

const user=await getCurrentUser();

if(!user)return;

const score=calculateScore();

const total=questions.length;

const percentage=Math.round(score/total*100);


const {data:previousAttempts,error:previousError} =
await supabaseClient

.from("quiz_results")
.select("id")
.eq("user_id",user.id)
.eq("quiz_id",quizId);


if(previousError){

showError("حدث خطأ أثناء قراءة محاولات الاختبار",previousError);

return;

}


const attemptNumber=(previousAttempts?.length||0)+1;


const {data:insertedData,error} =
await supabaseClient

.from("quiz_results")

.insert({

user_id:user.id,

quiz_id:quizId,

score:score,

total:total,

completed_at:new Date().toISOString()

})

.select();


if(error){

showError("حدث خطأ أثناء حفظ نتيجة الاختبار",error);

return;

}


let message=percentage===100
?"ممتاز جدًا! جميع إجاباتك صحيحة 🎉"
:percentage>=70
?"أحسنتِ! لديكِ فهم جيد للدرس 🌷"
:"بداية جيدة! راجعي التصحيح وحاولي تحسين نتيجتك 💗";


let review='<div class="review"><h3>تصحيح إجاباتك</h3>';

questions.forEach((q,index)=>{

const isCorrect=selectedAnswers[index]===q.correct;

const chosenText=q.options[selectedAnswers[index]];

const correctText=q.options[q.correct];

review+=`

<div class="review-item ${isCorrect?'good':'bad'}">

<strong>
السؤال ${index+1} — ${isCorrect?'إجابة صحيحة ✓':'إجابة غير صحيحة ✗'}
</strong>

<div>${q.question}</div>

<div class="${isCorrect?'answer-correct':'answer-wrong'}">
إجابتك: ${chosenText}
</div>

${!isCorrect?`
<div class="answer-correct">
الإجابة الصحيحة: ${correctText}
</div>`:''}

<div class="explanation">${q.explanation}</div>

</div>`;

});

review+='</div>';


area.innerHTML=`

<div class="result">

<div class="question">انتهى الاختبار 🎉</div>

<div class="score">${score} / ${total}</div>

<div class="message">${message}</div>

<p>النسبة: <strong>${percentage}%</strong></p>

<p style="color:#777;font-size:14px">
المحاولة رقم ${attemptNumber} — تم حفظ نتيجتك.
</p>

<div class="buttons" style="justify-content:center">

<button class="back-btn" onclick="location.reload()">
إعادة الاختبار
</button>

<a href="lesson.html?lesson=6" class="home-btn">
العودة إلى الدرس
</a>

</div>

</div>

${review}`;

area.scrollIntoView({behavior:"smooth",block:"start"});

}


getCurrentUser().then(user=>{

if(user){

renderQuestion();

}

});

</script>
</body>
</html>
