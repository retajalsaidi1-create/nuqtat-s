<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة المعلمة | نقطة س</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style> .teacher-dashboard { max-width: 1250px; margin: 40px auto; padding: 20px; } .teacher-title { text-align: center; margin-bottom: 30px; } .teacher-title h2 { margin-bottom: 8px; } .teacher-title p { color: #777; } .student-count { background: white; border-radius: 18px; padding: 20px; margin-bottom: 25px; text-align: center; box-shadow: 0 3px 15px rgba(0,0,0,0.08); } .student-count strong { font-size: 32px; display: block; color: #b85c7a; margin-bottom: 5px; } .students-table-container { background: white; border-radius: 18px; padding: 20px; overflow-x: auto; box-shadow: 0 3px 15px rgba(0,0,0,0.08); } .students-table { width: 100%; border-collapse: collapse; text-align: center; min-width: 1000px; } .students-table th { padding: 14px 10px; background: #f8e8ee; white-space: nowrap; } .students-table td { padding: 14px 10px; border-bottom: 1px solid #eee; } .students-table tr:last-child td { border-bottom: none; } .loading-message, .error-message { text-align: center; padding: 25px; color: #777; } .error-message { color: #b00020; } .progress-number { font-weight: bold; } .progress-bar { width: 100px; height: 9px; background: #eee; border-radius: 10px; overflow: hidden; margin: 7px auto 0; } .progress-fill { height: 100%; background: #b85c7a; border-radius: 10px; } .complete-badge { display: inline-block; padding: 5px 10px; border-radius: 20px; background: #e8f5e9; color: #2e7d32; font-size: 13px; font-weight: bold; } .no-progress { color: #999; } .back-home { display: block; width: fit-content; margin: 25px auto; text-decoration: none; } </style>

</head>

<body>

<header>

<h1>نقطة س</h1>

<p>لوحة المعلمة 👩🏻‍🏫</p>

</header>

<main class="teacher-dashboard">

<div class="teacher-title">

    <h2>مرحبًا أ. رتاج 🌷</h2>

    <p>
        هنا يمكنك متابعة الطلاب وتقدمهم في دروس المنصة.
    </p>

</div>


<div class="student-count">

    <strong id="studentCount">...</strong>

    <span>
        عدد الطلاب المسجلين
    </span>

</div>


<div class="students-table-container">

    <table class="students-table">

        <thead>

            <tr>

                <th>الطالب</th>

                <th>البريد الإلكتروني</th>

                <th>الصف</th>

                <th>تاريخ التسجيل</th>

                <th>آخر دخول</th>

                <th>الدروس المشاهدة</th>

                <th>الدروس المكتملة</th>

                <th>التقدم</th>

            </tr>

        </thead>


        <tbody id="studentsTableBody">

            <tr>

                <td colspan="8" class="loading-message">
                    جاري تحميل بيانات الطلاب...
                </td>

            </tr>

        </tbody>

    </table>

</div>


<a href="grades.html" class="back-home">
    ← العودة إلى المنصة
</a>

</main>

<script> const SUPABASE_URL = "https://nqtuiuglxabkyjlkmnhl.supabase.co"; const SUPABASE_KEY = "sb_publishable_ZHAJVrsRkWrgtGdqr7vrzA_c1LnyEPV"; const supabaseClient = window.supabase.createClient( SUPABASE_URL, SUPABASE_KEY ); // إيميل المعلمة المسموح له بدخول لوحة المعلمة const TEACHER_EMAIL = "retajalsaidi1@gmail.com"; async function loadTeacherDashboard() { const tableBody = document.getElementById( "studentsTableBody" ); const count = document.getElementById( "studentCount" ); // التحقق من المستخدم المسجل دخوله const { data: { user } } = await supabaseClient.auth.getUser(); // إذا لم يكن هناك تسجيل دخول if (!user) { window.location.href = "index.html"; return; } // التحقق من أن الإيميل هو إيميل المعلمة if ( !user.email || user.email.toLowerCase() !== TEACHER_EMAIL.toLowerCase() ) { document.querySelector( ".teacher-dashboard" ).innerHTML = ` <div style=" text-align:center; padding:60px 20px; "> <h2> 🚫 هذه الصفحة خاصة بالمعلمة </h2> <p style=" color:#777; margin-top:15px; "> لا تملك صلاحية الدخول إلى لوحة المعلمة. </p> <a href="grades.html" style=" display:inline-block; margin-top:25px; text-decoration:none; " > ← العودة إلى المنصة </a> </div> `; return; } // تحميل بيانات الطلاب من Supabase const { data, error } = await supabaseClient .rpc("get_teacher_dashboard"); if (error) { console.error(error); tableBody.innerHTML = ` <tr> <td colspan="8" class="error-message" > ❌ لا يمكن تحميل بيانات الطلاب. </td> </tr> `; return; } count.textContent = data.length; if (!data || data.length === 0) { tableBody.innerHTML = ` <tr> <td colspan="8" class="loading-message" > لا يوجد طلاب مسجلون حاليًا. </td> </tr> `; return; } tableBody.innerHTML = data.map(student => { const viewed = Number(student.lessons_viewed || 0); const completed = Number(student.lessons_completed || 0); const percentage = Number(student.progress_percentage || 0); return ` <tr> <td> ${ student.student_name && student.student_name.trim() !== "" ? student.student_name : "غير مضاف" } </td> <td> ${student.student_email || "-"} </td> <td> ${student.student_grade || "-"} </td> <td> ${formatDate(student.registered_at)} </td> <td> ${ student.last_login ? formatDate(student.last_login) : "لم يسجل دخولًا" } </td> <td> 👀 ${viewed} / 19 </td> <td> ${ completed === 19 ? `<span class="complete-badge">🎉 مكتمل</span>` : `✅ ${completed} / 19` } </td> <td> <div class="progress-number"> ${percentage}% </div> <div class="progress-bar"> <div class="progress-fill" style="width:${percentage}%" ></div> </div> </td> </tr> `; }).join(""); } function formatDate(date) { if (!date) { return "-"; } return new Date(date).toLocaleString( "ar-OM", { dateStyle: "medium", timeStyle: "short" } ); } loadTeacherDashboard(); </script>

</body>

</html>
